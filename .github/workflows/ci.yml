name: CI

# License server gates: typecheck + the full vitest suite running inside
# the REAL Workers runtime (workerd + miniflare D1) — the same engine
# that runs in production.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: license-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck + Workers-runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (workerd + miniflare D1)
        run: npm test
